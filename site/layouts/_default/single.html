{{ define "main" }}
<article class="px-4 md:px-0 py-10">
  <div class="max-w-6xl mx-auto space-y-6">
    <header class="space-y-2">
      <h1 class="font-display text-3xl md:text-4xl font-semibold">{{ .Title }}</h1>
      {{ with .Description }}<p class="text-muted">{{ . }}</p>{{ end }}
    </header>
    <div class="prose-feed">{{ .Content }}</div>
  </div>
</article>
{{ end }}
