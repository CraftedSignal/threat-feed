<header class="sticky top-0 z-30 backdrop-blur bg-base/85 border-b border-stroke">
  <div class="max-w-6xl mx-auto px-4 md:px-0 py-3 flex items-center gap-6">
    <button id="menu-toggle" class="md:hidden p-2 -ml-2 text-muted hover:text-text transition" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-menu">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6"  x2="21" y2="6"  />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <a href="{{ .Site.Home.RelPermalink }}" class="flex items-center gap-2 font-display text-base md:text-lg font-semibold text-text">
      <span>Threat Feed</span>
    </a>

    <nav class="hidden md:flex gap-5 text-sm text-muted">
      <a href="/briefs/" class="hover:text-text transition">Briefs</a>
      <a href="/severities/" class="hover:text-text transition">Severity</a>
      <a href="/products/" class="hover:text-text transition">Products</a>
      <a href="/vendors/" class="hover:text-text transition">Vendors</a>
      <a href="/tags/" class="hover:text-text transition">Tags</a>
      <a href="/actors/" class="hover:text-text transition">Actors</a>
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <a href="/feed.xml" class="inline-flex items-center justify-center w-9 h-9 rounded-lg border border-stroke text-muted hover:text-text hover:border-accent/40 transition" title="Subscribe via RSS" aria-label="Subscribe via RSS">
        <svg class="w-4 h-4" fill="currentColor" viewBox="3 6 16 17" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9h-2a7 7 0 0 0-7-7v-2zm0-4a13 13 0 0 1 13 13h-2A11 11 0 0 0 4 9V7zm2 11a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
      </a>

      <button data-theme-toggle data-theme-state="auto" aria-pressed="false" aria-label="Cycle theme: auto, light, dark"
              class="theme-toggle inline-flex items-center justify-center w-9 h-9 rounded-lg border border-stroke text-muted hover:text-text hover:border-accent/40 transition"
              title="Cycle theme: auto / light / dark">
        {{/* AUTO — half-filled circle (system follows OS). */}}
        <svg class="theme-icon-auto w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M12 3 a9 9 0 0 1 0 18 z" fill="currentColor"/>
        </svg>
        {{/* LIGHT — sun. */}}
        <svg class="theme-icon-light w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        {{/* DARK — moon. */}}
        <svg class="theme-icon-dark w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span data-theme-label class="sr-only">Auto</span>
      </button>

      <a class="hidden sm:inline-flex px-3 py-1.5 rounded-lg bg-accent text-white text-sm font-semibold shadow-soft hover:scale-[1.01] transition" href="{{ .Site.Params.marketingURL }}">Get full feed</a>
    </div>
  </div>

  <nav id="mobile-menu" class="hidden md:hidden border-t border-stroke bg-base/95 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-3 text-sm">
      <a href="/briefs/" class="py-2 text-muted hover:text-text transition">Briefs</a>
      <a href="/severities/" class="py-2 text-muted hover:text-text transition">Severity</a>
      <a href="/products/" class="py-2 text-muted hover:text-text transition">Products</a>
      <a href="/vendors/" class="py-2 text-muted hover:text-text transition">Vendors</a>
      <a href="/tags/" class="py-2 text-muted hover:text-text transition">Tags</a>
      <a href="/actors/" class="py-2 text-muted hover:text-text transition">Actors</a>
      <a href="{{ .Site.Params.marketingURL }}" class="py-2 text-accent hover:underline">Get full feed →</a>
    </div>
  </nav>
</header>
