baseURL = 'https://feed.craftedsignal.io/'
languageCode = 'en'
title = 'CraftedSignal Threat Feed'
defaultContentLanguage = 'en'
enableRobotsTXT = true
enableMissingTranslationPlaceholders = false

# Briefs are the only top-level content section.
mainSections = ['briefs']

[params]
  description = "Trending threats, MITRE ATT&CK coverage, and detection metadata — refreshed continuously."
  tagline = "Threat intelligence feed for SOC and IR teams"
  email = "hello@craftedsignal.io"
  appURL = "https://app.craftedsignal.io/"
  marketingURL = "https://craftedsignal.io/"
  githubURL = "https://github.com/craftedsignal"
  # notifierURL is the Cloud Run feed-notifier service. Set after first
  # `terraform apply` from the `feed_notifier_url` output.
  notifierURL = "https://notify.craftedsignal.io"
  # reCAPTCHA Enterprise site key — Cloud Armor blocks submissions
  # without a valid token. From `terraform output feed_notifier_recaptcha_site_key`.
  recaptchaSiteKey = "6Lf3Zs4sAAAAAG4CBo_segKlJ6oI6iRMHyjyXujw"

[taxonomies]
  tag = "tags"
  severity = "severities"
  type = "types"
  actor = "actors"
  vendor = "vendors"
  product = "products"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[build]
  [build.buildStats]
    enable = true

[minify]
  minifyOutput = true

# RSS + JSON Feed on home, section listing, and every taxonomy term.
# JSONFeed is a parallel feed format (https://www.jsonfeed.org/) — same
# items, easier to consume from scripts and modern aggregators.
[outputs]
  home = ["HTML", "RSS", "JSONFeed"]
  section = ["HTML", "RSS", "JSONFeed"]
  taxonomy = ["HTML", "RSS", "JSONFeed"]
  term = ["HTML", "RSS", "JSONFeed"]

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss+xml"
    baseName = "feed"
  [outputFormats.JSONFeed]
    mediatype = "application/feed+json"
    baseName = "feed"
    isPlainText = true
    notAlternative = false

[mediaTypes]
  [mediaTypes."application/rss+xml"]
    suffixes = ["xml"]
  [mediaTypes."application/feed+json"]
    suffixes = ["json"]

[sitemap]
  changeFreq = "hourly"
  priority = 0.7
  filename = "sitemap.xml"

[security]
  [security.funcs]
    # Allow the footer template to read GITHUB_SHA (injected by GitHub
    # Actions) so the build commit is rendered alongside the timestamp.
    # Hugo's default whitelist is HUGO_* and CI only; widen by one entry.
    getenv = ['^HUGO_', '^CI$', '^GITHUB_SHA$']

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.x]
    disable = true
  [privacy.youtube]
    disable = true
