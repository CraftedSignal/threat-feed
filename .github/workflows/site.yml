# Build and deploy the public threat-feed site (Hugo + Pagefind) to
# GitHub Pages at feed.craftedsignal.io.
#
# ti-bot writes one brief per commit, so deploying on every push creates a
# backlog of identical full-site builds. Production changes are batched into
# one deployment every 15 minutes; workflow_dispatch remains the escape hatch
# for an immediate deploy. Pull requests still build the full site as a check.
name: Site Deploy

on:
  schedule:
    # Offset from the top of the hour to avoid GitHub Actions' busiest cron window.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

# Keep at most one production build and one build per PR. A new scheduled run
# represents a newer snapshot of main, so it can safely retire an older build.
# PR builds use a separate group and can never cancel a production deployment.
concurrency:
  group: "site-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  changes:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.diff.outputs.site_changed }}
      previous_sha: ${{ steps.previous.outputs.sha }}
      previous_comparable: ${{ steps.previous.outputs.comparable }}
    steps:
      - name: Find previous successful production run
        id: previous
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_sha="$(
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/site.yml/runs" \
              -f branch=main \
              -f status=success \
              -f per_page=100 \
              --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch" or .event == "push") | .head_sha' \
              | sed -n '1p'
          )"
          comparable=false
          if [ -n "$previous_sha" ] && [[ ! "$previous_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Ignoring malformed previous production SHA"
          elif [ -n "$previous_sha" ]; then
            comparison="$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/compare/${previous_sha}...${GITHUB_SHA}" \
              --jq '.status' 2>/dev/null || true)"
            if [ "$comparison" = "ahead" ] || [ "$comparison" = "identical" ]; then
              comparable=true
            else
              echo "Previous production commit is not a verified ancestor"
            fi
          fi
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "comparable=$comparable" >> "$GITHUB_OUTPUT"

      - name: Checkout current deployment tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/site.yml
          sparse-checkout-cone-mode: false

      - name: Fetch previous production commit
        if: steps.previous.outputs.sha != ''
        working-directory: .
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA" || true
          fi

      - name: Check for undeployed site changes
        id: diff
        working-directory: .
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          PREVIOUS_COMPARABLE: ${{ steps.previous.outputs.comparable }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # Manual runs are explicitly asking for a fresh deployment even if
          # the selected commit was deployed already.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREVIOUS_SHA" ]; then
            echo "No previous production run found; building defensively"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${PREVIOUS_SHA}^{commit}"; then
            echo "Previous production commit is unavailable; building defensively"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PREVIOUS_COMPARABLE" != "true" ]; then
            echo "Previous production commit is not an ancestor; building defensively"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREVIOUS_SHA" "$CURRENT_SHA" -- \
            site/ .github/workflows/site.yml; then
            echo "No undeployed site changes"
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Undeployed site changes found"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          # Hugo 0.161+ invokes `node --permission` to sandbox the
          # postcss subprocess. The flag only landed unprefixed in
          # Node 24 — earlier majors only recognise the experimental
          # form and the build dies with `bad option: --permission`.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Copy fonts
        run: make fonts

      - name: Build site
        run: hugo --minify --gc

      - name: Build Pagefind index
        run: npx pagefind --site public --exclude-selectors '[data-pagefind-ignore], .pagefind-ignore'

  build:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.site_changed == 'true'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    # Hugo + Pagefind on the full feed normally runs in 2-4 minutes. Fail fast
    # on a stuck worker so a later scheduled snapshot can take over.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Copy fonts
        run: make fonts

      - name: Build site
        run: hugo --minify --gc

      - name: Build Pagefind index
        # Excluding rendered brief cards avoids indexing each brief again on
        # every listing page.
        run: npx pagefind --site public --exclude-selectors '[data-pagefind-ignore], .pagefind-ignore'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: 'site/public'
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  notify-subscribers:
    # Notify only after the matching batch is live. The diff starts at the
    # previous successful production deployment, so a failed/cancelled batch
    # is retried by the next successful run without losing new briefs.
    needs: [changes, deploy]
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout current notification inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/build-dispatch-payload.py
            site/content/briefs
          sparse-checkout-cone-mode: false

      - name: Fetch previous production commit
        if: needs.changes.outputs.previous_sha != ''
        env:
          PREVIOUS_SHA: ${{ needs.changes.outputs.previous_sha }}
        run: |
          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA" || true
          fi

      - name: Find new briefs in this deployment batch
        id: briefs
        env:
          PREVIOUS_SHA: ${{ needs.changes.outputs.previous_sha }}
          PREVIOUS_COMPARABLE: ${{ needs.changes.outputs.previous_comparable }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          : > /tmp/changed.txt

          if [ -z "$PREVIOUS_SHA" ]; then
            echo "No previous production deployment found; skipping subscriber backfill"
          elif ! git cat-file -e "${PREVIOUS_SHA}^{commit}"; then
            echo "Previous deployment commit is unavailable; skipping subscriber backfill"
          elif [ "$PREVIOUS_COMPARABLE" != "true" ]; then
            echo "Previous deployment is not an ancestor of this deployment; skipping subscriber backfill"
          else
            # Only newly added briefs generate new-brief notifications. Brief
            # modifications use ti-bot's separately deduplicated update path.
            git diff --name-only --diff-filter=A \
              "$PREVIOUS_SHA" "$CURRENT_SHA" -- \
              'site/content/briefs/*.md' > /tmp/changed.txt
          fi

          count="$(wc -l < /tmp/changed.txt | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Newly-added brief files in deployed batch: $count"

      - name: Set up Python
        if: steps.briefs.outputs.count != '0'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'

      - name: Install PyYAML
        if: steps.briefs.outputs.count != '0'
        run: pip install pyyaml

      - name: Build dispatch payload
        if: steps.briefs.outputs.count != '0'
        run: |
          python3 .github/scripts/build-dispatch-payload.py \
            < /tmp/changed.txt > /tmp/payload.json
          jq '.briefs | length' /tmp/payload.json

      - name: POST /dispatch
        if: steps.briefs.outputs.count != '0' && startsWith(env.NOTIFIER_URL, 'http') && env.NOTIFIER_DISPATCH_TOKEN != ''
        env:
          NOTIFIER_URL: ${{ secrets.NOTIFIER_URL }}
          NOTIFIER_DISPATCH_TOKEN: ${{ secrets.NOTIFIER_DISPATCH_TOKEN }}
        run: |
          echo "Notifier URL configured (${#NOTIFIER_URL} chars)"
          curl -fsS --max-time 60 \
            --request POST \
            --url "${NOTIFIER_URL%/}/dispatch" \
            --header "Authorization: Bearer $NOTIFIER_DISPATCH_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/payload.json
