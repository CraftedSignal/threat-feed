# Build and deploy the public threat-feed site (Hugo + Pagefind) to
# GitHub Pages at feed.craftedsignal.io. Triggers on any push to main
# that touches site/ — which includes ti-bot's brief commits via the
# Contents API.
name: Site Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize, don't cancel. ti-bot pushes one Markdown commit per brief
# every ~2s; cancelling means no deploy ever runs to completion. Queue
# them — each build is ~30s and Pages handles concurrent deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    # Hugo + Pagefind on ~2000 briefs runs in 2-4 minutes on this
    # runner. Anything north of 15 minutes is a stuck worker (we hit
    # one that ran for 4h+ without progress). Fail fast so the next
    # queued run can claim the slot instead of dying behind a zombie.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Hugo 0.161+ invokes `node --permission` to sandbox the
          # postcss subprocess. The flag only landed unprefixed in
          # Node 24 — earlier majors only recognise the experimental
          # form and the build dies with `bad option: --permission`.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Copy fonts
        run: make fonts

      # Hugo's processed-asset cache (PostCSS output, fingerprinted
      # js.Build bundles, font copies under site/resources/_gen).
      # These only invalidate when a CSS/JS source, the postcss/
      # tailwind config, the npm dependency set, or hugo.toml changes.
      # Brief Markdown is intentionally NOT in the key — ti-bot pushes
      # touch /content/briefs hundreds of times per backfill but the
      # processed assets they depend on stay identical, so keying on
      # briefs would burn the cache on every backfill.
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: site/resources
          key: hugo-resources-${{ hashFiles('site/assets/**', 'site/postcss.config.cjs', 'site/tailwind.config.js', 'site/package-lock.json', 'site/hugo.toml') }}
          restore-keys: |
            hugo-resources-

      - name: Build site
        run: hugo --minify --gc

      - name: Build Pagefind index
        # exclude-selectors strips the brief-card markup from the search
        # index so each brief is indexed once (from its own page) rather
        # than N+1 times (every listing that renders a card for it).
        # Keeps the index smaller and the search faster.
        run: npx pagefind --site public --exclude-selectors '[data-pagefind-ignore], .pagefind-ignore'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site/public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-subscribers:
    # Fire-and-forget call to the feed-notifier service so subscribers
    # whose filters match the new briefs get an email/Slack/Teams ping.
    # Skipped when the secrets aren't configured (e.g. before the
    # notifier is deployed).
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # need previous commit to diff against

      - name: Find new briefs in this push
        id: briefs
        run: |
          # Files added under site/content/briefs/ in this push.
          {
            git diff --name-only --diff-filter=AM \
              "${{ github.event.before }}" "${{ github.event.after }}" -- \
              'site/content/briefs/*.md' || true
          } > /tmp/changed.txt
          count=$(wc -l < /tmp/changed.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed brief files: $count"

      - name: Set up Python
        if: steps.briefs.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PyYAML
        if: steps.briefs.outputs.count != '0'
        run: pip install pyyaml

      - name: Build dispatch payload
        if: steps.briefs.outputs.count != '0'
        run: |
          python3 .github/scripts/build-dispatch-payload.py \
            < /tmp/changed.txt > /tmp/payload.json
          jq '.briefs | length' /tmp/payload.json

      - name: POST /dispatch
        if: steps.briefs.outputs.count != '0' && env.NOTIFIER_URL != '' && env.NOTIFIER_DISPATCH_TOKEN != ''
        env:
          NOTIFIER_URL: ${{ secrets.NOTIFIER_URL }}
          NOTIFIER_DISPATCH_TOKEN: ${{ secrets.NOTIFIER_DISPATCH_TOKEN }}
        run: |
          # Use --url and -- so curl can't interpret a secret URL that
          # happens to start with "-" as a CLI option. We saw a previous
          # run fail with `curl: option --/dispatch: is unknown` because
          # the URL was being treated as a flag.
          if [ -z "$NOTIFIER_URL" ]; then
            echo "NOTIFIER_URL is empty — skipping dispatch"
            exit 0
          fi
          echo "Notifier URL configured (${#NOTIFIER_URL} chars)"
          curl -fsS --max-time 60 \
            --request POST \
            --url "${NOTIFIER_URL%/}/dispatch" \
            --header "Authorization: Bearer $NOTIFIER_DISPATCH_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/payload.json
