name: Validate IoCs

on:
  push:
    branches: [main]
    paths:
      - 'site/content/briefs/**'
  pull_request:
    paths:
      - 'site/content/briefs/**'

jobs:
  validate:
    name: Check IoC quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Check for invalid IoCs
        run: python3 scripts/cleanup_iocs.py --check -v
