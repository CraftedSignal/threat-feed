name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          # CI-only, unmodified scanner; not linked into or shipped with feed artifacts.
          # The reviewed pinned revision uses AGPLv3, which permits running it unmodified:
          # https://github.com/trufflesecurity/trufflehog/blob/ea68ca03c865c5f324e86e849ced20ed3cf9dbbb/LICENSE
          # Keep the deny policy for all other dependencies and re-review future scanner updates.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Calculate bounded checkout depth
        id: checkout-depth
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
        run: |
          depth=1
          if [ "$EVENT_NAME" = "pull_request" ]; then
            depth=$((PR_COMMITS + 2))
          fi
          echo "depth=$depth" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.checkout-depth.outputs.depth }}

      - name: Fetch pull request base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb
        with:
          extra_args: --only-verified
