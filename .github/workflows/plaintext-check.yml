name: Plaintext Brief Check

on:
  push:
    branches: [main]
    paths:
      - 'output/**'
  pull_request:
    branches: [main]
    paths:
      - 'output/**'

permissions:
  contents: read

jobs:
  check:
    name: No Plaintext Briefs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify output files are encrypted
        # Every JSON under output/ except manifest/changelog must be a sealed
        # BundleManifest: { version, published_at, checksum, content<base64> }.
        # If a brief field (briefs/iocs/title/etc.) appears at the top level
        # of a JSON file under output/, the brief leaked in plaintext.
        run: |
          set -euo pipefail
          PLAINTEXT_FIELDS="iocs cve_refs mitre_techniques tlp_level briefs title summary period"

          fail=0
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            if [ "$base" = "manifest.json" ] || [ "$base" = "changelog.json" ]; then
              continue
            fi

            # Skip files that aren't valid JSON.
            if ! jq -e . "$f" > /dev/null 2>&1; then
              continue
            fi

            # Reject any plaintext top-level field.
            for field in $PLAINTEXT_FIELDS; do
              if jq -e --arg field "$field" 'has($field)' "$f" > /dev/null; then
                echo "FAIL: $f contains plaintext field: $field"
                fail=1
              fi
            done

            # Must have a base64 'content' field.
            if ! jq -e 'has("content")' "$f" > /dev/null; then
              echo "FAIL: $f missing encrypted content field"
              fail=1
              continue
            fi
            if ! jq -r '.content' "$f" | base64 --decode > /dev/null 2>&1; then
              echo "FAIL: $f content field is not valid base64 (may be plaintext)"
              fail=1
            fi
          done < <(find output -name '*.json' -print0)

          exit $fail
