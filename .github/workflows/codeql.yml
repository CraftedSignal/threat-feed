# Custom CodeQL config that overrides the default code-scanning workflow so
# ti-bot Markdown commits and merges of already-validated PRs do not repeat an
# analysis. Relevant PRs are scanned before merge, with weekly/manual backstops.
name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:website"
