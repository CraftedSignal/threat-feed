name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Static Site Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Claude review workflow policy
        run: ruby .github/scripts/verify-claude-workflow.rb

      - name: Set up Python for subscriber contract tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.x'

      - name: Test subscriber payload and taxonomy link contracts
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
