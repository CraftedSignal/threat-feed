name: Release Feed Bundle

on:
  push:
    branches: [main]
    paths:
      - 'output/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${COMMIT_SHA:0:7}"
          ASSETS="output/manifest.json"
          if ls output/briefs/*.json 2>/dev/null; then
            ASSETS="$ASSETS $(ls output/briefs/*.json)"
          fi
          gh release create "$TAG" \
            $ASSETS \
            --title "Feed $TAG" \
            --notes "Bundle updated from commit $COMMIT_SHA" \
            --latest
